/* ---------- 5.3 beelden, oog en camera ---------- */
dwp(H5, { id:'h5_beeld', titel:'Beelden, oog en camera', par:'5⁠.3 · lenzenformule en vergroting', sim:LENS, voorSim: () => { LENS.f = 10; LENS.v = 25; },
  uitleg: () => leerdoelen('Ik bereken de beeldafstand met de lenzenformule ' + BR('1', 'f') + ' = ' + BR('1', 'v') + ' + ' + BR('1', 'b') + '.', 'Ik bereken de vergroting N = ' + BR('b', 'v') + '.', 'Ik leg uit wanneer een bolle lens een echt en wanneer een virtueel beeld maakt.', 'Ik leg uit hoe het oog en een camera een scherp beeld maken.', '★ Ik reken aan een projector.') + `
    <p>Voor een bolle lens geldt de <b>lenzenformule</b>: ${BR('1', 'f')} = ${BR('1', 'v')} + ${BR('1', 'b')}. Hierin is v de voorwerpsafstand en b de beeldafstand. De <b>vergroting</b> is N = ${BR('b', 'v')}.</p>
    <p>Staat het voorwerp verder dan f van de lens, dan ontstaat achter de lens een <b>echt</b>, omgekeerd beeld dat je op een scherm kunt opvangen. Staat het voorwerp binnen f, dan werkt de lens als <b>loep</b>: je neemt een vergroot, rechtop staand, virtueel beeld waar.</p>
    <div class="kader">In het oog vormt de ooglens een beeld op het netvlies. Bij een <b>bijziend</b> oog ligt het beeld van verre voorwerpen vóór het netvlies: een hol (negatief) brillenglas helpt. Bij een <b>verziend</b> oog ligt het beeld van dichtbij achter het netvlies: een bol (positief) brillenglas helpt.</div>`,
  voorbeeld:{ vraag:'Een voorwerp staat 20 cm voor een bolle lens met f = 5,0 cm. Bereken de beeldafstand en de vergroting.', stappen:[BR('1', 'b') + ' = ' + BR('1', 'f') + ' − ' + BR('1', 'v') + ' = ' + BR('1', '5,0') + ' − ' + BR('1', '20') + ' = 0,15 cm<sup>−1</sup>, dus b = ' + BR('1', '0,15') + ' = 6,7 cm.', 'N = ' + BR('b', 'v') + ' = ' + BR('6,7', '20') + ' = 0,33: het beeld is 3 keer zo klein.'] },
  maakSerie: () => [
    { titel:'Twee keer vergroot', vraag:'Rechts staat een bolle lens met f = 10 cm.', stappen:[
      simStap('Stel f = 10 cm in en zoek de voorwerpsafstand waarbij het beeld twee keer zo groot is als het voorwerp.', () => LENS.f === 10 && Math.abs(LENS.b() / LENS.v - 2) < 0.02, 'Verschuif v tot de vergroting N = 2,00 is.', 'f = 10 cm, v = 15 cm'),
      getalStap('Controleer met de lenzenformule: bereken de beeldafstand bij deze voorwerpsafstand:', 30, 'cm', BR('1', 'b') + ' = ' + BR('1', '10') + ' − ' + BR('1', '15') + ' = ' + BR('1', '30') + ', dus b = 30 cm. N = ' + BR('30', '15') + ' = 2.', 'Schrijf de lenzenformule om naar ' + BR('1', 'b') + '.', 0.01)] },
    { titel:'Camera', vraag:'Een camera heeft een lens met f = 5,0 cm. Je fotografeert een persoon die 3,0 m voor de lens staat.', stappen:[
      getalStap('Bereken de beeldafstand in cm:', 5.085, 'cm', BR('1', 'b') + ' = ' + BR('1', '5,0') + ' − ' + BR('1', '300') + ' = 0,1967, dus b = 5,08 cm.', 'Reken v om naar cm.', 0.005),
      keuzeStap('Waar ligt het beeld bij een voorwerp dat heel ver weg is?', [{ html:'vrijwel in het brandpunt', g:1 }, { html:'precies midden tussen lens en brandpunt' }, { html:'oneindig ver achter de lens' }, { html:'vóór de lens' }])] },
    { titel:'Loep', vraag:'Gebruik de simulatie rechts.', stappen:[
      simStap('Stel f = 12 cm in en zet het voorwerp op 6 cm van de lens.', () => LENS.f === 12 && LENS.v === 6, 'Gebruik de twee schuiven.', 'f = 12 cm, v = 6 cm'),
      chipStap('Welke uitspraken over het beeld zijn nu juist? Kies alle juiste.', [{ html:'het beeld is virtueel', g:1 }, { html:'het beeld staat rechtop', g:1 }, { html:'het beeld is groter dan het voorwerp', g:1 }, { html:'het beeld kun je opvangen op een scherm' }, { html:'het beeld staat ondersteboven' }], 'Het voorwerp staat binnen de brandpuntsafstand.')] },
    { titel:'Bril', vraag:'Twee leerlingen hebben een oogafwijking.', stappen:[
      selectsStap('Kies bij elke beschrijving de juiste combinatie.', [{ z:'Sem kan het bord achter in de klas niet scherp waarnemen', a:'bij' }, { z:'Noor kan een boek op 25 cm niet scherp lezen', a:'ver' }], [{ v:'bij', t:'bijziend, holle lens' }, { v:'ver', t:'verziend, bolle lens' }, { v:'bijb', t:'bijziend, bolle lens' }, { v:'verh', t:'verziend, holle lens' }], 'Wie heeft moeite met ver en wie met dichtbij? Welke lens maakt de bundel meer of minder convergent?')] },
    { titel:'Projector', ster:true, vraag:'Een projector maakt van een dia van 3,6 cm hoog een scherp beeld van 1,8 m hoog. Het scherm staat 4,5 m van de lens.', stappen:[
      getalStap('Bereken de vergroting:', 50, '', 'N = ' + BR('180 cm', '3,6 cm') + ' = 50.', 'De vergroting is ook beeldhoogte gedeeld door voorwerpshoogte.', 0.01),
      getalStap('Bereken de afstand van de dia tot de lens in cm:', 9.0, 'cm', 'v = ' + BR('b', 'N') + ' = ' + BR('450 cm', '50') + ' = 9,0 cm.', 'Gebruik N = ' + BR('b', 'v') + '.', 0.01),
      getalStap('Bereken de brandpuntsafstand van de lens in cm:', 8.824, 'cm', BR('1', 'f') + ' = ' + BR('1', '9,0') + ' + ' + BR('1', '450') + ' = 0,1133, dus f = 8,8 cm.', 'Gebruik de lenzenformule.', 0.01)] }
  ] });

/* ---------- 6.1 zon, aarde en maan ---------- */
const KAART61 = kop('Zon, aarde en maan', 'bewegingen en hun gevolgen') + `<table class="data"><tr><th>beweging</th><th>duur</th><th>gevolg</th></tr>
  <tr><td>aarde draait om haar eigen as</td><td>24 h</td><td>dag en nacht</td></tr><tr><td>aarde draait om de zon</td><td>365,25 dagen</td><td>een jaar</td></tr><tr><td>maan draait om de aarde</td><td>29,5 dagen (van volle maan tot volle maan)</td><td>schijngestalten van de maan</td></tr></table>
  <div class="kader">De aardas staat 23,5° scheef ten opzichte van de baan om de zon. Is het noordelijk halfrond naar de zon gekanteld, dan valt het zonlicht daar steiler in en zijn de dagen langer: zomer.</div>
  <div class="kader">Zonsverduistering: de maan staat precies tussen de zon en de aarde. Maansverduistering: de aarde staat precies tussen de zon en de maan.</div>`;
dwp(H6, { id:'h6_zam', titel:'Zon, aarde en maan', par:'6⁠.1 · dag en nacht, seizoenen, maanfasen', sim:KAART, voorSim: () => KAART.zet(KAART61),
  uitleg: () => leerdoelen('Ik verklaar dag en nacht, een jaar en de schijngestalten van de maan met de bewegingen van aarde en maan.', 'Ik verklaar de seizoenen met de scheve stand van de aardas.', 'Ik leg uit hoe een zonsverduistering en een maansverduistering ontstaan.', '★ Ik leg uit waarom er niet elke maand een zonsverduistering is.') + `
    <p>De zon is een ster: hij zendt zelf licht uit. De aarde en de maan kaatsen het zonlicht alleen terug. Er is altijd één helft van de maan verlicht, maar vanaf de aarde nemen we daar een steeds ander deel van waar: de <b>schijngestalten</b> (nieuwe maan, eerste kwartier, volle maan, laatste kwartier).</p>
    <p>De <b>seizoenen</b> komen niet doordat de afstand tot de zon verandert. Ze komen door de scheve aardas: in de zomer valt het licht op ons halfrond steiler in en staat de zon langer boven de horizon.</p>
    <div class="kader">Bij <b>nieuwe maan</b> staat de maan tussen de zon en de aarde; bij <b>volle maan</b> staat de aarde tussen de zon en de maan.</div>`,
  voorbeeld:{ vraag:'Leg uit waarom het in Australië winter is als het in Nederland zomer is.', stappen:['In de Nederlandse zomer is het noordelijk halfrond naar de zon gekanteld.', 'Het zuidelijk halfrond, met Australië, is dan van de zon af gekanteld: het licht valt daar schuiner in en de dagen zijn korter. Het is daar winter.'] },
  maakSerie: () => [
    { titel:'Verklaringen', vraag:'Elk verschijnsel heeft een eigen oorzaak.', stappen:[

    { titel:'Verduistering', vraag:'Zon, aarde en maan kunnen op één lijn komen te staan.', stappen:[
      selectsStap('Kies bij elke verduistering welk hemellichaam in het midden staat.', [{ z:'zonsverduistering', a:'maan' }, { z:'maansverduistering', a:'aarde' }], [{ v:'zon', t:'de zon' }, { v:'aarde', t:'de aarde' }, { v:'maan', t:'de maan' }], 'Wiens schaduw valt op wie?'),
      keuzeStap('Bij welke schijngestalte kan een maansverduistering alleen plaatsvinden?', [{ html:'volle maan', g:1 }, { html:'nieuwe maan', fb:'Dan staat de maan tussen de zon en de aarde.' }, { html:'eerste kwartier' }, { html:'laatste kwartier' }])] },
    { titel:'Seizoenen', vraag:'Een leerling zegt: "In de zomer is het warm, omdat de aarde dan dichter bij de zon staat."', stappen:[
      keuzeStap('Wat is de juiste verklaring voor de zomer in Nederland?', [{ html:'het noordelijk halfrond is naar de zon gekanteld, zodat het zonlicht steiler invalt en de dagen langer zijn', g:1 }, { html:'de aarde staat in de zomer dichter bij de zon', fb:'De afstand verandert maar weinig en de seizoenen zijn op het noordelijk en zuidelijk halfrond tegengesteld.' }, { html:'de zon geeft in de zomer meer licht' }, { html:'de aarde draait in de zomer langzamer om haar as' }])] },
    { titel:'Draaiende aarde', vraag:'De omtrek van de aarde bij de evenaar is 4,0·10<sup>4</sup> km.', stappen:[

/* =====================================================================
   Docentmodus: uitwerkingen bij elke opdracht en een antwoordenblad
   Aanzetten met #docent achter de link.
   ===================================================================== */
const DOCKEY = 'nk-docentmodus';
if (/docent/.test(location.hash)) try { localStorage.setItem(DOCKEY, '1'); } catch (e){}
let DOCENT = false; try { DOCENT = localStorage.getItem(DOCKEY) === '1'; } catch (e){}
function docStap(st){
  try {
    if (st.type === 'zelf') return spLijst(st.punten.map(p => [1, p])) + (st.model ? `<div class="model">${st.model}</div>` : '');
    if (st.type === 'sim') return '<i>Leerling stelt in:</i> ' + (st.hint || '');
    if (st.type === 'chips') return st.opties.filter(x => x.g).map(x => x.html).join(' · ');
    const a = st.antwoord ? st.antwoord() : '';
    return a && !/undefined|null|NaN/.test(a) ? a : (st.hint || '—');
  } catch (e){ return '<i>Hangt af van de meting van de leerling.</i> ' + (st.hint || ''); }
}
function docOpdracht(o, kop){
  return `<div class="dopd">${kop ? `<div class="dtitel">${kop}</div>` : ''}${o.stappen.map((st, k) => `<div class="dstap"><span class="n">${k + 1}</span><div><div class="dvr">${st.vr || ''}</div><div class="dant">${docStap(st)}</div></div></div>`).join('')}</div>`;
}
const _renderOpdracht = renderOpdracht;
renderOpdracht = function(w, p){
  let h = _renderOpdracht(w, p);
  if (DOCENT){ const o = p.serie[p.idx]; h += `<div class="docent"><div class="dkop">Docent · uitwerking van deze opdracht</div>${docOpdracht(o)}</div>`; }
  return h;
};
function antwoordenblad(){
  let filter = ''; try { if (typeof NAVFILTER !== 'undefined') filter = localStorage.getItem(NAVFILTER) || ''; } catch (e){}
  const titel = document.title;
  let h = `<div class="geenprint ablknop"><button class="btn" id="abl_print">Opslaan als pdf / printen</button><button class="btn g" id="abl_dicht">Sluiten</button>
    <span class="noot">Opdrachten met willekeurige getallen staan hier met de getallen van de huidige serie.</span></div>
    <h1>${titel} · antwoordenblad</h1><div class="ameta">${filter ? filter + ' · ' : ''}${new Date().toLocaleDateString('nl-NL', { day:'numeric', month:'long', year:'numeric' })}</div>`;
  let groep = null;
  WPS.forEach(w => {
    if (filter && w.groep !== filter) return;
    if (w.eigen){
      if (typeof DIAG !== 'undefined'){ h += `<h2>Diagnose</h2>` + DIAG.map(sd => `<h3>${sd.sub} ${sd.naam}</h3>` + sd.items.map(it => `<div class="aopd"><div class="atitel">${it.id} · ${it.ww} · ${it.p}p</div>${it.fig || ''}<div class="avraag">${it.vraag}</div>
        ${it.type === 'getal' ? `<div class="dant"><b>Antwoord:</b> ${tien(it.w, it.nsig || 3)} ${it.eenh}${it.nsig ? ` (${it.nsig} significante cijfers)` : ''}</div>` : ''}
        ${it.type === 'keuze' ? `<div class="dant"><b>Antwoord:</b> ${it.opties.filter(o => o.g).map(o => o.html).join(' · ')}</div>` : ''}${spLijst(it.uitw)}</div>`).join('')).join(''); }
      return;
    }
    if (w.groep !== groep){ groep = w.groep; h += `<h2>${groep}</h2>`; }
    if (!PER_WP[w.id]) nieuweSerie(w);
    const p = PER_WP[w.id];
    h += `<h3>${w.titel}${w.ster ? ' ★' : ''}</h3>` + p.serie.map((o, k) => `<div class="aopd"><div class="atitel">${o.ster ? '★' : 'Opdracht ' + (k + 1)} · ${o.titel}</div>${o.vraag ? `<div class="avraag">${o.vraag}</div>` : ''}${docOpdracht(o)}</div>`).join('');
  });
  let el = $('#ablad'); if (!el){ el = document.createElement('div'); el.id = 'ablad'; document.body.appendChild(el); }
  el.innerHTML = h; document.body.classList.add('ablad-open'); el.scrollTop = 0;
  $('#abl_dicht').onclick = () => document.body.classList.remove('ablad-open');
  $('#abl_print').onclick = () => window.print();
}
if (DOCENT){
  const v = document.querySelector('aside .voet');
  if (v){ const d = document.createElement('div'); d.className = 'docvoet';
    d.innerHTML = `<div class="dlabel">Docentmodus</div><button id="ablknop">Antwoordenblad</button><button id="docuit">Docentmodus uit</button>`;
    v.prepend(d);
    $('#ablknop').onclick = antwoordenblad;
    $('#docuit').onclick = () => { try { localStorage.removeItem(DOCKEY); } catch (e){} location.hash = ''; location.reload(); }; }
}

/* ---------- start ---------- */
$('#beamerknop').onclick = () => document.body.classList.toggle('beamer');
$('#resetknop').onclick = () => { if (confirm('Alle voortgang wissen?')){ STAAT.voortgang = {}; bewaar({}); for (const k in PER_WP) delete PER_WP[k]; open(STAAT.wp); } };
open(0);
requestAnimationFrame(lus);
