<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natuurkunde 4 havo</title>
<style>
:root{
  --papier:#f3efe6; --vel:#fffdf8; --rand:#e3dccb; --rand2:#d6cdb8;
  --inkt:#2b2a27; --inkt2:#3e3b35; --grijs:#7a756b; --goud:#a0701f; --goud2:#e2a84b;
  --nacht:#24323f; --nacht2:#33475a; --nachttekst:#cfd9e2;
  --goed:#3f8f63; --goedbg:#e5f2ea; --fout:#b4473a; --foutbg:#f8e6e2; --hint:#fbf1da;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--inkt);font-size:15px;line-height:1.6}
sub,sup{font-size:.72em;line-height:0}
button{font-family:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}

/* ---------- zijbalk ---------- */
aside{background:var(--nacht);color:var(--nachttekst);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside h1{font-family:var(--serif);font-size:23px;color:#fff;font-weight:600;line-height:1.2}
aside .sub{font-size:12.5px;color:#8aa0b3;margin:4px 0 26px}
aside nav a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;font-size:14.5px;margin-bottom:4px;color:#b9c7d3;cursor:pointer;user-select:none;line-height:1.3}
aside nav a:hover{background:#2c3d4d}
aside nav a i{font-style:normal;flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #5d7387;font-size:12.5px;font-weight:700}
aside nav a.on{background:var(--nacht2);color:#fff}
aside nav a.on i{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
aside nav a.klaar i{background:#5aa37c;border-color:#5aa37c;color:#fff}
aside nav a small{display:block;font-size:11.5px;color:#8aa0b3}
aside .voet{margin-top:auto;display:flex;flex-direction:column;gap:8px}
aside .voet button{background:transparent;border:1px solid #4b6074;color:#cfd9e2;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
aside .voet button:hover{background:#2c3d4d}
aside .voet .klein{font-size:11.5px;color:#6f859a}

/* ---------- werkplaats ---------- */
.wp{display:grid;grid-template-columns:minmax(380px,1fr) minmax(540px,640px);min-height:100vh}
.tekst{padding:34px 38px 60px;max-width:760px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--goud);font-weight:700}
.tekst h2{font-family:var(--serif);font-size:31px;margin:3px 0 14px;font-weight:600;line-height:1.2}
.tekst h3{font-family:var(--serif);font-size:19px;margin:22px 0 6px;font-weight:600}
.tekst p{margin-bottom:10px;color:var(--inkt2)}
.tekst ul{margin:0 0 10px 20px;color:var(--inkt2)}
.tekst li{margin-bottom:3px}
.kader{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;color:var(--inkt2)}
.kader.binas{border-left-color:#5d7387}
.f{white-space:nowrap}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--rand2)}
.tabs button{background:none;border:0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--goud2)}
.tabs button .tel{font-weight:500;font-size:12px;color:var(--grijs);margin-left:4px}

/* voorbeeld */
.vb{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:4px 0 14px}
.vb .vbkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:4px}
.vb .vbvraag{font-weight:600;margin-bottom:8px}
.vbstap{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--rand2)}
.vbstap .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vbstap .b{color:var(--inkt2)}
.vb .verder{margin-top:8px}

/* opdrachten */
.oknop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.oknop .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rand2);background:var(--vel);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--grijs);cursor:pointer}
.oknop .dot.on{border-color:var(--inkt);color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#fff}
.oknop .dot.ster{border-style:dashed}
.oknop .rechts{margin-left:auto;font-size:13px;color:var(--grijs)}
.opdkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--grijs);margin-bottom:4px}
.opdkop .st{color:var(--goud)}
.opdvraag{font-size:16px;margin-bottom:12px;color:var(--inkt)}
.stap{display:flex;gap:12px;padding:13px 15px;background:var(--vel);border:1px solid var(--rand);border-radius:11px;margin-bottom:10px}
.stap>.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.stap.dicht{opacity:.42;pointer-events:none}
.stap.dicht .inv{display:none}
.stap.goed{border-color:#bcdcc8;background:#fbfefc}
.stap.goed>.n{background:var(--goed)}
.stap .inh{flex:1;min-width:0}
.stap .vr{margin-bottom:8px}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{font-family:var(--mono);font-size:15px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;flex:1 1 100%}
input.in:focus{outline:2px solid var(--goud2);outline-offset:0;border-color:var(--goud2)}
.voorbeeldweergave{font-size:13px;color:var(--grijs);min-height:20px;margin-top:4px}
.voorbeeldweergave b{color:var(--inkt);font-weight:600;font-size:15px}
select.sel{border:1px solid var(--rand2);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--inkt);font-family:inherit}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--inkt);color:#fff}
.btn:hover{background:#45433e}
.btn.g{background:#ebe4d4;color:var(--inkt)}
.btn.g:hover{background:#e0d7c3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.klein{padding:5px 11px;font-size:13px}
.fb{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:14px;display:none}
.fb.toon{display:block}
.fb.goed{background:var(--goedbg);color:#255c3d}
.fb.fout{background:var(--foutbg);color:#7c2c22}
.fb.hint{background:var(--hint);color:#6b4d12}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--inkt)}
.chip:hover{border-color:#b9ad93}
.chip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.opties{display:flex;flex-direction:column;gap:6px}
.optie{border:1.5px solid var(--rand2);background:#fff;border-radius:9px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--inkt)}
.optie:hover{border-color:#b9ad93}
.optie.aan{border-color:var(--nacht);background:#eef2f6}
.typtip{font-size:12.5px;color:var(--grijs);margin-top:14px;line-height:1.5}
.typtip code{font-family:var(--mono);background:#ebe4d4;border-radius:4px;padding:0 4px;font-size:12px}
.klaarbanner{background:var(--goedbg);border:1px solid #bcdcc8;color:#255c3d;border-radius:11px;padding:12px 15px;margin:4px 0 12px}

/* ---------- simulatiekolom ---------- */
.simkol{background:var(--vel);border-left:1px solid var(--rand);padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.simkol>*{flex-shrink:0}
.simkop{display:flex;justify-content:space-between;align-items:baseline}
.simkop b{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud)}
.simkop span{font-size:12.5px;color:var(--grijs)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl label{font-size:13.5px;color:var(--inkt2);display:flex;gap:6px;align-items:center}
.doek{border:1px solid var(--rand);border-radius:12px;background:#fbf8f1;position:relative;overflow:hidden}
.doek canvas{display:block;width:100%;height:auto}
.waarneming{font-size:14px;color:var(--inkt2);min-height:22px}
.waarneming b{color:var(--inkt)}
.vgl{font-family:var(--serif);font-size:19px;text-align:center;min-height:30px;color:var(--inkt)}
.tabelkop{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--goud);margin-bottom:6px;text-transform:uppercase}
table.b45{border-collapse:collapse;font-size:13px;background:#fff;color:var(--inkt)}
table.b45 th,table.b45 td{border:1px solid #6d6a62;padding:2px 0;text-align:center;width:38px}
table.b45 th{font-weight:600;background:#fff}
table.b45 th.hoek{width:46px;font-size:10px;font-weight:400;color:var(--grijs)}
table.b45 td.licht{background:#f6e3bf;font-weight:700}
table.b45 tr.licht th, table.b45 th.licht{background:#f3ead6}
.legenda{font-size:12px;color:var(--grijs);margin-top:6px;line-height:1.45}
.balk{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.balk .lijn{display:flex;align-items:center;gap:8px}
.balk .lijn span.lab{width:120px;color:var(--inkt2)}
.balk .vak{display:flex;gap:3px;flex-wrap:wrap}
.balk .q{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.balk .q.p{background:#c4822b}.balk .q.m{background:#3b6fa8}
.uitkomst{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:10px 14px;font-size:14.5px}
.uitkomst .groot{font-family:var(--serif);font-size:22px}
.buislog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}
.buislog div{background:#fff;border:1px solid var(--rand);border-radius:8px;padding:5px 7px;line-height:1.35}
.buislog div b{display:block;font-size:12.5px}

/* niveau */
.niveau{display:flex;gap:4px;margin:-14px 0 22px}
.niveau button{flex:1;background:transparent;border:1px solid #4b6074;color:#b9c7d3;border-radius:7px;padding:5px;font-weight:700;font-size:13px;cursor:pointer}
.niveau button.aan{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
/* moleculen */
svg.mol{display:block;max-width:100%;height:auto}
.molkader{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:8px 10px;margin:8px 0;overflow-x:auto}
.molrij{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.molrij .plus{font-size:22px;color:var(--grijs)}
.molnaam{font-size:12.5px;color:var(--grijs);text-align:center;margin-top:2px}
/* tekenveld */
.tv{background:#fff;border:1px solid var(--rand2);border-radius:10px;overflow:hidden}
.tvbalk{display:flex;flex-wrap:wrap;gap:4px;padding:7px;background:#f7f2e6;border-bottom:1px solid var(--rand)}
.tvk{border:1px solid var(--rand2);background:#fff;border-radius:7px;padding:4px 10px;font-family:Georgia,serif;font-size:15px;cursor:pointer;min-width:34px;color:var(--inkt)}
.tvk[data-a],.tvk[data-t="gum"]{font-family:var(--sans);font-size:13px}
.tvk.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.tvsep{width:1px;background:var(--rand2);margin:0 4px}
.tvdoek{overflow:auto;max-height:340px}
.tvsvg{display:block;touch-action:none;cursor:crosshair;background:#fffdf8}
.tvuitleg{font-size:12px;color:var(--grijs);padding:5px 9px;border-top:1px solid var(--rand)}
input.getal{max-width:200px;flex:0 1 200px}
.eenheid{font-size:15px;color:var(--inkt2)}
.formule{font-family:var(--serif);font-size:17px;margin:6px 0}
.breuk{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.95em}
.breuk>span:first-child{border-bottom:1.3px solid currentColor;padding:0 4px}
.breuk>span:last-child{padding:0 4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14.5px}
.kv b{font-family:var(--serif);font-size:18px;font-weight:600}
table.data{border-collapse:collapse;font-size:14px;background:#fff;margin:6px 0}
table.data th,table.data td{border:1px solid var(--rand2);padding:3px 10px;text-align:right}
table.data th{background:#f7f2e6;font-weight:600}
.fitvak{margin-top:10px;padding:10px 12px;border:1px dashed #D9822B;border-radius:10px;background:#fdf6ec}
.fitkop{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:#b8641a;margin-bottom:4px}
.fitvak .inp{font:inherit;font-size:14px;padding:4px 7px;border:1px solid #d8cfbd;border-radius:6px;background:#fff}
.reeksen{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.reeksen label{display:flex;gap:8px;align-items:center}
.reeksen i{display:inline-block;width:14px;height:4px;border-radius:2px}
.info{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;background:#fff;border:1px solid var(--rand);border-radius:10px;padding:9px 12px}
.info b{font-weight:600}
.schuif{display:flex;align-items:center;gap:8px;font-size:13.5px}
.schuif input{width:150px}
/* beamerstand */
body.beamer{font-size:18px}
body.beamer .tekst h2{font-size:36px}
body.beamer .opdvraag{font-size:19px}
body.beamer input.in{font-size:18px}
body.beamer .optie, body.beamer .chip{font-size:17px}
body.beamer table.b45{font-size:15px}

@media (max-width:1180px){
  .wp{grid-template-columns:1fr}
  .simkol{position:static;height:auto;border-left:0;border-top:1px solid var(--rand)}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto}
}
@media print{aside,.simkol{display:none}.wp{display:block}}


.leerdoelen{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:12px 16px 6px;margin:4px 0 6px}
.leerdoelen b{display:block;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud);margin-bottom:4px}
.leerdoelen ul{list-style:none;margin:0!important;padding:0}
.leerdoelen li{padding:4px 0 4px 26px;position:relative;color:var(--inkt2)}
.leerdoelen li::before{content:"";position:absolute;left:2px;top:9px;width:13px;height:13px;border:1.5px solid var(--goud2);border-radius:3px}
.leerdoelen li.ster::before{content:"★";border:0;color:var(--goud);top:3px;left:1px;font-size:14px}
.kl{font-size:12.5px;color:var(--grijs);line-height:1.45}
#simhouder{display:flex;flex-direction:column;gap:10px}
#simhouder .simkop{margin-bottom:2px}
/* ===== Stijl C: examenpapier, donker ===== */
:root{
  --papier:#1c1f23; --vel:#25292f; --rand:#363c44; --rand2:#4a525c;
  --inkt:#f0ebe2; --inkt2:#d2cbbf; --grijs:#9c958a; --goud:#e0845c; --goud2:#d9774f;
  --nacht:#15171a; --nacht2:#2a2e34; --nachttekst:#d2cbbf;
  --goed:#62bb87; --goedbg:rgba(98,187,135,.13); --fout:#e9806a; --foutbg:rgba(233,128,106,.13); --hint:rgba(224,132,92,.12);
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --rood:#d9774f; --stempel:#62bb87;
}
body{background-color:var(--papier);
  background-image:linear-gradient(rgba(217,119,79,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(217,119,79,.045) 1px,transparent 1px),
  linear-gradient(rgba(217,119,79,.085) 1px,transparent 1px),linear-gradient(90deg,rgba(217,119,79,.085) 1px,transparent 1px);
  background-size:6px 6px,6px 6px,30px 30px,30px 30px}
.app{grid-template-columns:270px minmax(0,1fr)}
aside{background:var(--nacht);border-right:1px solid #33383f;padding:22px 14px 16px}
aside h1{font-size:22px;letter-spacing:.2px}
aside h1 em{font-style:normal;color:var(--rood)}
aside .sub{color:#8f897f;margin:4px 0 14px}
aside nav{overflow-y:auto;flex:1 1 auto;min-height:0;margin-right:-6px;padding-right:6px}
aside nav::-webkit-scrollbar{width:6px}aside nav::-webkit-scrollbar-thumb{background:#3a4048;border-radius:3px}
.navgroep{font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--rood);margin:12px 4px 4px;padding-bottom:3px;border-bottom:1px solid #33383f}
.navgroep:first-child{margin-top:0}
aside nav a{padding:6px 8px;margin-bottom:1px;font-size:13.8px;color:#cfc8bc;gap:10px;border-radius:6px}
aside nav a:hover{background:#22262b}
aside nav a i{width:23px;height:23px;border-radius:4px;border-color:#555c66;font-size:11.5px}
aside nav a.on{background:#262a30;color:#fff;box-shadow:inset 3px 0 0 var(--rood)}
aside nav a.on i{background:var(--rood);border-color:var(--rood);color:#1c1f23}
aside nav a.klaar i{background:var(--goed);border-color:var(--goed);color:#15171a}
aside nav a small{color:#8f897f;font-size:11px}
aside .voet{padding-top:10px;border-top:1px solid #33383f;margin-top:8px}
aside .voet button{border-color:#3d434b;color:#d2cbbf;padding:6px 10px}
aside .voet button:hover{background:#22262b}
aside .voet .klein{color:#7b756c}
.tekst h2{letter-spacing:.2px}
.tekst h3{color:var(--inkt)}
.kicker{font-family:var(--mono);color:var(--rood)}
.tabs{border-bottom-color:var(--rand)}
.tabs button{color:var(--grijs)}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--rood)}
.kader{background:rgba(21,23,26,.6);border-color:var(--rand);border-left-color:var(--rood)}
.vb,.stap,.leerdoelen{background:rgba(37,41,47,.92);border-color:var(--rand)}
.leerdoelen b{color:var(--rood)}
.leerdoelen li::before{border-color:var(--rood)}
.leerdoelen li.ster::before{color:var(--rood)}
.vb .vbkop{color:var(--rood)}
.vbstap{border-top-color:var(--rand)}
.vbstap .n,.stap>.n{background:var(--inkt);color:#1c1f23}
.stap.goed{border-color:#3f7a59;background:rgba(98,187,135,.06)}
.stap.goed>.n{background:var(--goed)}
.oknop .dot{background:transparent;border-color:#555c66;color:#cfc8bc}
.oknop .dot.on{border-color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset;color:var(--inkt)}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#15171a}
input.in,select.sel,textarea.in{background:#16191c;color:var(--inkt);border-color:#4a525c}
input.in::placeholder,textarea.in::placeholder{color:#777168}
textarea.in{font-family:var(--sans);font-size:15px;border:1px solid #4a525c;border-radius:8px;padding:8px 10px;width:100%;resize:vertical;line-height:1.5}
textarea.in:focus,input.in:focus{outline:2px solid var(--rood);border-color:var(--rood)}
.btn{background:var(--rood);color:#1c1f23}
.btn:hover{background:#ea9470}
.btn.g{background:transparent;color:var(--inkt);border:1px solid #4a525c}
.btn.g:hover{background:#2c3137}
.fb.goed{color:#cdeedb}.fb.fout{color:#ffd9cf}.fb.hint{color:#f6d9c8}
.chip,.optie{background:transparent;color:var(--inkt);border-color:#4a525c}
.chip:hover,.optie:hover{border-color:var(--rood)}

<script>

/* Getalvelden met decimale komma. Een type="number"-veld leest een komma niet
   (in Chrome wordt "0,5" dan 5). Daarom worden alle getalvelden tekstvelden die
   een komma tonen en accepteren; de code leest ze nog steeds als 0.5. */
(function () {
  const d = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  const naarKomma = x => String(x).replace(/(\d)\.(\d)/g, '$1,$2');
  function zet(el) {
    if (el.dataset.komma) return;
    const v = d.get.call(el);
    el.dataset.komma = '1';
    el.type = 'text';
    el.setAttribute('inputmode', 'decimal');
    el.setAttribute('autocomplete', 'off');
    Object.defineProperty(el, 'value', {
      configurable: true,
      get() { return d.get.call(this).trim().replace(/\s/g, '').replace(',', '.'); },
      set(x) { d.set.call(this, naarKomma(x)); }

    if (el.placeholder) el.placeholder = naarKomma(el.placeholder);
  }
  // stijlregels voor getalvelden ook laten gelden voor de omgezette velden
  try {
    for (const sh of document.styleSheets) {
      let regels; try { regels = sh.cssRules; } catch (e) { continue; }
      for (const r of [...regels]) {
        if (r.selectorText && /type=["']?number/.test(r.selectorText)) {

          sh.insertRule(sel + '{' + r.style.cssText + '}', sh.cssRules.length);

    }
  } catch (e) {}
  const alles = root => { if (root.matches && root.matches('input[type="number"]')) zet(root); if (root.querySelectorAll) root.querySelectorAll('input[type="number"]').forEach(zet); };
  alles(document);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) alles(n); })))
    .observe(document.documentElement, { childList: true, subtree: true });

const komma = x => String(x).replace(/(\d)\.(\d)/g, '$1,$2');
/* getal als a·10^n in html */
function tien(x, n = 3){
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  if (e >= -2 && e <= 3) return komma(+x.toPrecision(n));
  const m = x / Math.pow(10, e);
  return komma(m.toFixed(n - 1)) + '·10<sup>' + (e < 0 ? '−' + (-e) : e) + '</sup>';

/* aantal significante cijfers van een ingetypt getal */
function sigTel(s){
  let t = String(s).trim().replace(/\s+/g, '').replace(/^[-−+]/, '');
  t = t.split(/[eE]|[×x*·]10/)[0];

/* rekenstap met significantie: waarde én aantal cijfers */
function sigStap(vr, waarde, eenheid, nsig, uitleg, hint, tol = 0.02, minstens = false){
  return { type:'getal', vr, eenheid, hint, ph:'getal',
    check: v => { const x = leesGetal(v); if (isNaN(x)) return { ok:false, msg:'Typ een getal, bijvoorbeeld <code>2,4</code> of <code>6,3e3</code>.' };
      if (Math.abs(x - waarde) > Math.abs(waarde) * tol) return { ok:false, msg:'Nog niet goed. ' + hint };

      return { ok:true, msg:'Goed! ' + uitleg }; },

/* ---------- figuren op papier (svg) ---------- */
let FIGNR = 0;
function grafiekSVG(o){
  const W = o.w || 470, H = o.h || 280, L = 50, R = 14, T = 12, B = 40;
  const [x0, x1] = o.x, [y0, y1] = o.y, sub = o.sub || 5;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => H - B - (y - y0) / (y1 - y0) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif" font-size="11">`;
  const fmt = v => komma(+v.toFixed(4));
  for (let v = x0, k = 0; v <= x1 + 1e-9; v += o.dx / sub, k++) s += `<line x1="${X(v)}" y1="${Y(y0)}" x2="${X(v)}" y2="${Y(y1)}" stroke="${k % sub ? '#e0b9a4' : '#c98a6c'}" stroke-width="${k % sub ? .5 : .9}"/>`;
  for (let v = y0, k = 0; v <= y1 + 1e-9; v += o.dy / sub, k++) s += `<line x1="${X(x0)}" y1="${Y(v)}" x2="${X(x1)}" y2="${Y(v)}" stroke="${k % sub ? '#e0b9a4' : '#c98a6c'}" stroke-width="${k % sub ? .5 : .9}"/>`;
  for (let v = x0; v <= x1 + 1e-9; v += o.dx) s += `<text x="${X(v)}" y="${H - B + 15}" text-anchor="middle">${fmt(v)}</text>`;
  for (let v = y0; v <= y1 + 1e-9; v += o.dy) s += `<text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  s += `<line x1="${X(x0)}" y1="${Y(y0)}" x2="${X(x1)}" y2="${Y(y0)}" stroke="#222" stroke-width="1.3"/><line x1="${X(x0)}" y1="${Y(y0)}" x2="${X(x0)}" y2="${Y(y1)}" stroke="#222" stroke-width="1.3"/>`;
  s += `<text x="${W - R}" y="${H - 6}" text-anchor="end" font-style="italic">${o.xlab}</text><text x="${L - 40}" y="${T + 4}" font-style="italic" transform="rotate(-90 ${L - 40} ${T + 4})" text-anchor="end">${o.ylab}</text>`;
  (o.lijnen || []).forEach(l => {
    let pts = l.pts;
    if (l.f){ pts = []; const a = l.van ?? x0, b = l.tot ?? x1; for (let i = 0; i <= 300; i++){ const x = a + (b - a) * i / 300; pts.push([x, l.f(x)]); } }
    s += `<polyline fill="none" stroke="${l.kleur || '#1b3f8a'}" stroke-width="${l.dik || 2}" points="${pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ')}"/>`;
  });
  (o.punten || []).forEach(p => s += `<g stroke="#1b3f8a" stroke-width="1.6"><line x1="${X(p[0]) - 4}" y1="${Y(p[1]) - 4}" x2="${X(p[0]) + 4}" y2="${Y(p[1]) + 4}"/><line x1="${X(p[0]) - 4}" y1="${Y(p[1]) + 4}" x2="${X(p[0]) + 4}" y2="${Y(p[1]) - 4}"/></g>`);
  if (o.extra) s += o.extra(X, Y);
  s += '</svg>';
  return `<div class="fig"><div class="figkop">${o.kop || ('figuur ' + (++FIGNR))}</div>${s}</div>`;
}

/* ---------- canvas met assen (voor de vaardigheden en labs) ---------- */
class Assen {
  constructor(ctx, o){ Object.assign(this, { L:56, R:16, T:14, B:42 }, o); this.ctx = ctx; this.W = ctx.W; this.H = ctx.H; }
  X(x){ return this.L + (x - this.x0) / (this.x1 - this.x0) * (this.W - this.L - this.R); }
  Y(y){ return this.H - this.B - (y - this.y0) / (this.y1 - this.y0) * (this.H - this.T - this.B); }
  iX(px){ return this.x0 + (px - this.L) / (this.W - this.L - this.R) * (this.x1 - this.x0); }
  iY(py){ return this.y0 + (this.H - this.B - py) / (this.H - this.T - this.B) * (this.y1 - this.y0); }
  rooster(papier = true){
    const c = this.ctx, sub = this.sub || 5;
    if (this.vul !== false){ c.fillStyle = papier ? '#f3eee3' : '#16191c'; c.fillRect(0, 0, this.W, this.H); }
    const lijn = (a, b, d, e, groot) => { c.strokeStyle = papier ? (groot ? '#c98a6c' : '#e6c3b0') : (groot ? '#3b4149' : '#262b31'); c.lineWidth = groot ? 0.9 : 0.5; c.beginPath(); c.moveTo(a, b); c.lineTo(d, e); c.stroke(); };
    for (let k = 0; this.x0 + k * this.dx / sub <= this.x1 + 1e-9; k++){ const x = this.X(this.x0 + k * this.dx / sub); lijn(x, this.Y(this.y0), x, this.Y(this.y1), k % sub === 0); }
    for (let k = 0; this.y0 + k * this.dy / sub <= this.y1 + 1e-9; k++){ const y = this.Y(this.y0 + k * this.dy / sub); lijn(this.X(this.x0), y, this.X(this.x1), y, k % sub === 0); }
    c.strokeStyle = papier ? '#222' : '#cfc8bc'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(this.X(this.x0), this.Y(this.y1)); c.lineTo(this.X(this.x0), this.Y(this.y0)); c.lineTo(this.X(this.x1), this.Y(this.y0)); c.stroke();
    c.fillStyle = papier ? '#222' : '#cfc8bc'; c.font = '11px Segoe UI, Arial'; c.textAlign = 'center';
    const f = v => String(+v.toFixed(4));
    for (let v = this.x0; v <= this.x1 + 1e-9; v += this.dx) c.fillText(f(v), this.X(v), this.H - this.B + 15);
    c.textAlign = 'right'; for (let v = this.y0; v <= this.y1 + 1e-9; v += this.dy) c.fillText(f(v), this.L - 6, this.Y(v) + 4);
    c.font = 'italic 12px Segoe UI, Arial'; c.textAlign = 'right'; c.fillText(this.xlab, this.W - this.R, this.H - 8);
    c.save(); c.translate(14, this.T); c.rotate(-Math.PI / 2); c.fillText(this.ylab, 0, 0); c.restore();
  }
  kromme(f, a, b, kleur = '#1b3f8a', dik = 2){ const c = this.ctx; c.strokeStyle = kleur; c.lineWidth = dik; c.beginPath();
    for (let i = 0; i <= 300; i++){ const x = a + (b - a) * i / 300, y = f(x); i ? c.lineTo(this.X(x), this.Y(y)) : c.moveTo(this.X(x), this.Y(y)); } c.stroke(); }
  kruis(x, y, kleur = '#1b3f8a'){ const c = this.ctx, px = this.X(x), py = this.Y(y); c.strokeStyle = kleur; c.lineWidth = 1.6; c.beginPath(); c.moveTo(px - 4, py - 4); c.lineTo(px + 4, py + 4); c.moveTo(px - 4, py + 4); c.lineTo(px + 4, py - 4); c.stroke(); }
}
function canvasIn(host, w, h, cls = 'cnv'){ const ctx = maakCanvas(host, w, h); ctx.canvas_.className = cls; return ctx; }
function muisPos(ctx, e){ const r = ctx.canvas_.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * ctx.W, (e.clientY - r.top) / r.height * ctx.H]; }
function schuif(id, lab, min, max, stap, waarde, fmt){ return `<label>${lab} <input type="range" id="${id}" min="${min}" max="${max}" step="${stap}" value="${waarde}"> <b id="${id}_t">${fmt ? fmt(waarde) : waarde}</b></label>`; }
function koppelSchuif(id, fmt, fn){ const el = $('#' + id); const t = $('#' + id + '_t'); el.oninput = () => { const v = +el.value; t.innerHTML = fmt ? fmt(v) : v; fn(v); }; return el; }

function labPush(w){ if (typeof LABKEUS !== 'undefined' && !LABKEUS.includes(w.id)) return; if (typeof LABGROEP !== 'undefined' && LABGROEP[w.id]) w.groep = LABGROEP[w.id]; WPS.push(w); }
function sorteerWPS(volgorde){ const oud = WPS.slice(); WPS.length = 0; volgorde.forEach(g => { const l = oud.filter(w => w.groep === g); l.filter(w => w.icoon !== '✎').concat(l.filter(w => w.icoon === '✎')).forEach(w => WPS.push(w)); }); oud.filter(w => !volgorde.includes(w.groep)).forEach(w => WPS.push(w)); }

const DEELTJES = { p:{ n:'proton', m:1.6726e-27, q:1 }, d:{ n:'deuteron', m:3.3436e-27, q:1 }, a:{ n:'α-deeltje', m:6.6447e-27, q:2 } };

      <div class="rijc">${schuif('cy_B', 'B', 0.2, 1.5, 0.01, this.B, v => komma(v.toFixed(2)) + ' T')}${schuif('cy_f', 'frequentie', 1, 30, 0.05, this.f, v => komma(v.toFixed(2)) + ' MHz')}</div>

    $('#cy_start').onclick = () => this.start();
  },
  start(){ const D = DEELTJES[this.dl], q = D.q * K.e, fc = q * this.B / (2 * Math.PI * D.m), fs = this.f * 1e6;

      <div class="meter"><div>baan<b id="bn_vorm">–</b></div><div>omlooptijd<b id="bn_T">–</b></div><div>kleinste / grootste hoogte<b id="bn_r">–</b></div></div>
      <div class="noot">De simulatie rekent met G·M<sub>aarde</sub> = 3,986·10<sup>14</sup> m<sup>3</sup>/s<sup>2</sup> en R<sub>aarde</sub> = 6371 km. De tijd loopt versneld.</div></div>`;

  lanceer(h, v){ if (!(h > 0) || !(v > 0)) return; this.h = h; this.v = v;

  acc(x, y){ const GM = K.G * K.Maarde, r = Math.hypot(x, y), a = -GM / r ** 3; return [a * x, a * y]; },
  update(dt){ const s = this.sp; if (!s || s.af) return; const GM = K.G * K.Maarde, h = s.Tc / 3000;

      s.vx += h / 6 * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]); s.vy += h / 6 * (k1[3] + 2 * k2[3] + 2 * k3[3] + k4[3]); s.t += h;

  draw(){ const c = this.ctx; if (!c) return; const W = c.W, H = c.H, cx = W / 2, cy = H / 2;

};

/* ---------- sterren en spectra ---------- */
const LIJNEN = { H:{ n:'waterstof', l:[410.2, 434.0, 486.1, 656.3] }, He:{ n:'helium', l:[447.1, 471.3, 492.2, 501.6, 587.6, 667.8, 706.5] }, Na:{ n:'natrium', l:[589.0, 589.6] },

function lambdaKleur(l){ let r = 0, g = 0, b = 0;
  if (l < 440){ r = -(l - 440) / 60; b = 1; } else if (l < 490){ g = (l - 440) / 50; b = 1; } else if (l < 510){ g = 1; b = -(l - 510) / 20; } else if (l < 580){ r = (l - 510) / 70; g = 1; } else if (l < 645){ r = 1; g = -(l - 645) / 65; } else r = 1;
  const f = l < 420 ? .3 + .7 * (l - 380) / 40 : l > 700 ? .3 + .7 * (750 - l) / 50 : 1;
  return `rgb(${Math.round(255 * r * f)},${Math.round(255 * g * f)},${Math.round(255 * b * f)})`; }
const STER = {
  T:5800, verborgen:null, toonMax:false, onbekend:['H', 'Na'],
  planck(l, T){ const L = l * 1e-9; return 1 / (L ** 5 * (Math.exp(K.h * K.c / (L * 1.381e-23 * T)) - 1)); },
  init(host){
    host.innerHTML = `<div class="paneel"><div class="pkop"><b>Stralingskromme</b><span id="st_kop">zwarte straler</span></div><div id="st_doek"></div>
      <div class="rijc">${schuif('st_T', 'T', 2000, 30000, 100, this.T, v => v + ' K')}<label><input type="checkbox" id="st_max"> markeer λ<sub>max</sub></label></div>
      <div class="pkop" style="margin-top:6px"><b>Spectra</b><span>emissielijnen (Binas) en het spectrum van ster Q</span></div><div id="st_sp"></div></div>`;
    this.ctx = canvasIn($('#st_doek'), 560, 300, 'cnv papier'); this.sp = canvasIn($('#st_sp'), 560, 250);
    this.as = new Assen(this.ctx, { x0:0, x1:3000, y0:0, y1:1, dx:250, dy:.2, sub:5, xlab:'λ (nm)', ylab:'intensiteit (relatief)', L:46 });
    koppelSchuif('st_T', v => v + ' K', v => this.T = v);
    $('#st_max').onchange = e => this.toonMax = e.target.checked;
    this.opdracht(this.o);
  },
  opdracht(o){ this.o = o; this.verborgen = o && o.sterT ? o.sterT : null;
    if (!$('#st_T')) return; $('#st_T').disabled = !!this.verborgen; $('#st_max').disabled = !!this.verborgen; if (this.verborgen) { $('#st_max').checked = false; this.toonMax = false; }

  draw(){ const a = this.as, c = this.ctx; if (!a) return; a.rooster(true);

    a.kromme(l => this.planck(l, T) / mx * 0.9, 20, 3000);
    if (this.toonMax){ c.setLineDash([4, 4]); c.strokeStyle = '#b0432a'; c.beginPath(); c.moveTo(a.X(lm), a.Y(0)); c.lineTo(a.X(lm), a.Y(.9)); c.stroke(); c.setLineDash([]); c.fillStyle = '#b0432a'; c.font = '12px Segoe UI'; c.textAlign = 'left'; c.fillText('λmax = ' + Math.round(lm) + ' nm', a.X(lm) + 6, a.Y(.93)); }
    const s = this.sp, W = s.W; s.fillStyle = '#16191c'; s.fillRect(0, 0, W, s.H);

  lam(){ const dE = Math.abs(this.E(this.van) - this.E(this.naar)); return dE ? 1239.84 / dE : null; },

  f0:2.5, f:1.0, b:1.0, t:0,
  A(f){ return this.f0 * this.f0 / Math.sqrt((this.f0 ** 2 - f ** 2) ** 2 + (this.b * f) ** 2); },
  init(host){ host.innerHTML = `<div class="paneel">${kop('Gedwongen trilling', 'eigenfrequentie f<sub>0</sub> = 2,5 Hz')}<div id="rs_doek"></div>
    <div class="rijc">${schuif('rs_f', 'aandrijffrequentie', 0.2, 5, 0.1, this.f, v => komma(v.toFixed(1)) + ' Hz')}${schuif('rs_b', 'demping', 0.4, 4, 0.2, this.b, v => komma(v.toFixed(1)))}</div>
    <div class="noot">Links: het trillende voorwerp. Rechts: de amplitude bij elke aandrijffrequentie (resonantiekromme).</div></div>`;
    this.ctx = canvasIn($('#rs_doek'), 560, 320, 'cnv papier');
    koppelSchuif('rs_f', v => komma(v.toFixed(1)) + ' Hz', v => this.f = v); koppelSchuif('rs_b', v => komma(v.toFixed(1)), v => this.b = v); },
  update(dt){ this.t += dt; },
  draw(){ const c = this.ctx; if (!c) return; c.fillStyle = '#f3eee3'; c.fillRect(0, 0, c.W, c.H);
    const Amax = 7, a = new Assen(c, { x0:0, x1:5, y0:0, y1:Amax, dx:1, dy:1, xlab:'f (Hz)', ylab:'A (relatief)', L:200, vul:false }); a.rooster(true);
    a.kromme(f => Math.min(Amax, this.A(f)), 0.01, 5); a.kruis(this.f, Math.min(Amax, this.A(this.f)), '#b0432a');
    const u = Math.min(Amax, this.A(this.f)) * 14 * Math.sin(2 * Math.PI * this.f * this.t * 0.5), y0 = 150;
    c.fillStyle = '#4a525c'; c.fillRect(40, 20 + 8 * Math.sin(2 * Math.PI * this.f * this.t * 0.5), 80, 8);
    c.strokeStyle = '#333'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(80, 28); for (let i = 1; i <= 12; i++) c.lineTo(80 + (i % 2 ? -10 : 10), 28 + (y0 + u - 50) * i / 12); c.lineTo(80, y0 + u - 18); c.stroke();
    c.fillStyle = '#e0845c'; c.fillRect(64, y0 + u - 18, 32, 32); c.strokeStyle = '#999'; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(30, y0); c.lineTo(140, y0); c.stroke(); c.setLineDash([]); }
};

/* =====================================================================
   Algemene opbouw: zijbalk, werkplaats, voorbeeld, opdrachten in stappen
   ===================================================================== */
const WPS = [];
const TEKENINGEN = {};
const STAAT = { wp:0, tab:'uitleg', voortgang: laad(), niveau: '5V' };
const PER_WP = {};             /* per werkplaats: { serie, idx, st:[{stap, goed:[], getoond, pogingen}] } */
let SIM = null;

function maakCanvas(host, w, h){
  const c = document.createElement('canvas'), dpr = Math.max(1, window.devicePixelRatio || 1);
  c.width = w * dpr; c.height = h * dpr; c.style.aspectRatio = w + ' / ' + h;
  host.appendChild(c);
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); ctx.W = w; ctx.H = h; ctx.canvas_ = c;
  return ctx;
}

function zichtbaar(w){ return !w.alleen6 || STAAT.niveau === '6V'; }
function renderNav(){
      let g = null, n = 0, h = '';
      WPS.forEach((w, i) => {
        if (w.groep !== g){ g = w.groep; n = 0; h += `<div class="navgroep">${g}</div>`; }
        n++;
        const klaar = STAAT.voortgang[w.id] && STAAT.voortgang[w.id].klaar;
        h += `<a data-i="${i}" class="${i === STAAT.wp ? 'on' : ''} ${klaar ? 'klaar' : ''}"><i>${klaar ? '✓' : w.ster ? '★' : (w.icoon || n)}</i><span>${w.titel}<small>${w.par}</small></span></a>`;
      });
      $('#nav').innerHTML = h;
      $$('#nav a').forEach(a => a.onclick = () => open(+a.dataset.i));
    }
    
    function open(i){
  STAAT.wp = i; STAAT.tab = 'uitleg';
  const w = WPS[i];
  if (w.eigen){ SIM = null; parkeer(); $('#main').innerHTML = '<div class="eigen" id="eigen"></div>'; w.eigen($('#eigen')); renderNav(); window.scrollTo(0, 0); return; }
  if (!PER_WP[w.id]) nieuweSerie(w);

function nieuweSerie(w){
  const serie = w.maakSerie();
  PER_WP[w.id] = { serie, idx:0, serieNr: (PER_WP[w.id] ? PER_WP[w.id].serieNr + 1 : 0), st: serie.map(() => ({ stap:0, getoond:false, klaar:false, pogingen:{} })) };
}

function renderTekst(){
  const w = WPS[STAAT.wp], p = PER_WP[w.id];
  const nGoed = p.st.filter((s, k) => s.klaar && !s.getoond && !p.serie[k].ster).length, nTot = p.serie.filter(o => !o.ster).length;
  let h = `<div class="kicker">${w.ster ? w.groep + ' · ★ verdieping' : w.groep + ' · ' + w.par}</div><h2>${w.titel}</h2>
    <div class="tabs"><button data-t="uitleg" class="${STAAT.tab === 'uitleg' ? 'on' : ''}">Uitleg en voorbeeld</button>
    <button data-t="opd" class="${STAAT.tab === 'opd' ? 'on' : ''}">Opdrachten<span class="tel">${nGoed}/${nTot}</span></button></div>`;
  if (STAAT.tab === 'uitleg'){
    h += w.uitleg() + renderVoorbeeld(w);

    h += renderOpdracht(w, p);

  if (STAAT.tab === 'uitleg') koppelVoorbeeld(w); else koppelOpdracht(w, p);
}

/* ---------- uitgewerkt voorbeeld, stap voor stap ---------- */
function renderVoorbeeld(w){
  const vb = w.voorbeeld; if (!vb) return '';
  const n = w._vbStap || 0;
  let h = `<div class="vb"><div class="vbkop">Voorbeeld</div><div class="vbvraag">${vb.vraag}</div>`;
  for (let k = 0; k < n; k++) h += `<div class="vbstap"><span class="n">${k + 1}</span><div class="b">${vb.stappen[k]}</div></div>`;
  h += n < vb.stappen.length ? `<div class="verder"><button class="btn g klein" id="vbverder">${n ? 'Volgende stap' : 'Toon de uitwerking'} ▸</button></div>`
                             : `<div class="verder"><button class="btn klein" id="naaropd">Naar de opdrachten ▸</button></div>`;
  return h + '</div>';
}
function koppelVoorbeeld(w){
  const b = $('#vbverder'); if (b) b.onclick = () => { w._vbStap = (w._vbStap || 0) + 1; renderTekst(); w.voorbeeld.bijStap && w.voorbeeld.bijStap(w._vbStap); };

/* ---------- opdrachten ---------- */
function renderOpdracht(w, p){
  const o = p.serie[p.idx], s = p.st[p.idx];
  const nTot = p.serie.filter(x => !x.ster).length;
  let h = '';
  if (STAAT.voortgang[w.id] && STAAT.voortgang[w.id].klaar && p.st.every((x, k) => p.serie[k].ster || (x.klaar && !x.getoond)))
    h += `<div class="klaarbanner"><b>Werkplaats afgerond.</b> Probeer ook de ★-opdrachten, of oefen met een nieuwe serie.</div>`;
  h += `<div class="oknop">` + p.serie.map((x, k) => {
    const st = p.st[k];
    return `<span class="dot ${k === p.idx ? 'on' : ''} ${st.klaar && !st.getoond ? 'goed' : ''} ${x.ster ? 'ster' : ''}" data-k="${k}" title="${x.titel}">${x.ster ? '★' : k + 1}</span>`;
  }).join('') + `<span class="rechts"><button class="btn g klein" id="nieuweserie">Nieuwe serie</button></span></div>`;
  h += `<div class="opdkop">${o.ster ? '<span class="st">★ </span>' : ''}Opdracht ${o.ster ? '★' : p.idx + 1}${o.ster ? '' : ' van ' + nTot} · ${o.titel}</div>`;
  if (o.vraag) h += `<div class="opdvraag">${o.vraag}</div>`;
  o.stappen.forEach((st, k) => {
    const dicht = k > s.stap, goed = k < s.stap || s.klaar;
    h += `<div class="stap ${dicht ? 'dicht' : ''} ${goed ? 'goed' : ''}" data-k="${k}">${o.stappen.length > 1 ? `<span class="n">${goed ? '✓' : k + 1}</span>` : ''}<div class="inh">
      <div class="vr">${st.vr}</div>${goed ? `<div class="antw">${st.antwoord()}</div>` : `<div class="inv">${invoerHTML(st, k)}</div>`}
      <div class="fb" id="fb${k}"></div></div></div>`;
  });
  if (s.klaar){
    const volgende = p.idx < p.serie.length - 1;
    h += `<div class="rij" style="margin-top:6px">${volgende ? `<button class="btn" id="volgende">Volgende opdracht ▸</button>` : ''}${o.naKlaar ? `<span class="waarneming">${o.naKlaar()}</span>` : ''}</div>`;
  }
  if (o.stappen.some(x => x.type === 'teken')) h += `<div class="typtip">${TEKENTIP}</div>`;
  else if (o.stappen.some(x => x.type === 'getal')) h += `<div class="typtip">${GETALTIP}</div>`;
  return h;
}
const TEKENTIP = 'Tekenen: kies een atoomsoort en klik op het raster. Sleep vanaf een atoom om een binding met een nieuw of bestaand atoom te maken. Klik op een binding voor een dubbele binding. <b>+H aanvullen</b> zet ontbrekende H-atomen, maar je mag ze ook zelf zetten. <b>~</b> is een open binding: de keten gaat verder.';
const GETALTIP = 'Typ een getal met een komma, bijvoorbeeld <code>2,4</code>. Een macht van tien typ je zo: <code>6,3e3</code> of <code>6,3·10^3</code>.';
const TYPTIP = 'Zo typ je (voorbeelden met titaan en chromaat): <code>Ti2(CrO4)3</code> · ion <code>Ti3+</code> of <code>CrO4 2-</code> · pijl <code>-></code> · toestand <code>(s)</code> <code>(aq)</code> <code>(l)</code> · coëfficiënt ervoor: <code>3 CrO4 2-(aq)</code>.';

function invoerHTML(st, k){
  const knoppen = `<button class="btn" data-ctl="${k}">Controleer</button><button class="btn g" data-hint="${k}">Hint</button><button class="btn g" data-toon="${k}" style="display:none">Toon antwoord</button>`;
  if (st.type === 'sim') return `<div class="rij">${knoppen}</div>`;

  if (st.type === 'chips') return `<div class="chips" id="ch${k}">${st.opties.map((x, j) => `<span class="chip" data-j="${j}">${x.html}</span>`).join('')}</div><div class="rij" style="margin-top:9px">${knoppen}</div>`;
  if (st.type === 'keuze') return `<div class="opties" id="op${k}">${st.opties.map((x, j) => `<button class="optie" data-j="${j}">${x.html}</button>`).join('')}</div><div class="rij" style="margin-top:9px">${knoppen}</div>`;
  if (st.type === 'teken') return `<div id="tv${k}"></div><div class="rij" style="margin-top:9px">${knoppen}</div>`;
  if (st.type === 'getal') return `<div class="rij"><input class="in getal" id="in${k}" autocomplete="off" spellcheck="false" placeholder="${st.ph || 'antwoord'}"><span class="eenheid">${st.eenheid || ''}</span></div><div class="rij" style="margin-top:9px">${knoppen}</div>`;
  if (st.type === 'selects') return `<div class="rij">${st.selects.map((s, j) => `<label style="font-size:14px;display:flex;justify-content:space-between;gap:10px;width:100%;align-items:center;border-bottom:1px dashed var(--rand);padding:4px 0">${s.lab} <select class="sel" id="se${k}_${j}"><option value="">kies…</option>${s.opties.map(x => `<option value="${x.v}">${x.t}</option>`).join('')}</select></label>`).join('')}</div><div class="rij" style="margin-top:9px">${knoppen}</div>`;
  return '';

function koppelOpdracht(w, p){
  const o = p.serie[p.idx], s = p.st[p.idx];
  $$('.oknop .dot').forEach(d => d.onclick = () => { p.idx = +d.dataset.k; renderTekst(); zetOpdrachtInSim(); });
  $('#nieuweserie').onclick = () => { nieuweSerie(w); renderTekst(); zetOpdrachtInSim(); };
  const v = $('#volgende'); if (v) v.onclick = () => { p.idx++; renderTekst(); zetOpdrachtInSim(); };
  o.stappen.forEach((st, k) => {
    if (k !== s.stap || s.klaar) return;
    const inp = $('#in' + k);
    if (st.type === 'teken'){
      const sleutel = w.id + '|' + p.idx + '|' + k + '|' + p.serieNr;
      const tv = new Tekenveld($('#tv' + k), { breedte: st.breedte || 32, hoogte: st.hoogte || 13 });
      if (TEKENINGEN[sleutel]) tv.zet(TEKENINGEN[sleutel]);
      const oud = tv.teken.bind(tv); tv.teken = () => { oud(); TEKENINGEN[sleutel] = tv.g; };
      tv.melding = m => { const fb = $('#fb' + k); fb.className = 'fb toon hint'; fb.innerHTML = m; };
      st._tv = tv;
    }
    if (inp && st.type === 'getal'){ inp.onkeydown = e => { if (e.key === 'Enter') controleer(w, p, k); }; setTimeout(() => inp.focus({ preventScroll:true }), 30); }
    else if (inp && st.type !== 'zelf'){
      inp.onkeydown = e => { if (e.key === 'Enter') controleer(w, p, k); };
      setTimeout(() => inp.focus({ preventScroll:true }), 30);
    }
    $$(`#ch${k} .chip`).forEach(c => c.onclick = () => c.classList.toggle('aan'));
    $$(`#op${k} .optie`).forEach(c => c.onclick = () => {
      if (!st.meer) $$(`#op${k} .optie`).forEach(x => x !== c && x.classList.remove('aan'));
      c.classList.toggle('aan');
    });
    $(`[data-ctl="${k}"]`).onclick = () => controleer(w, p, k);
    $(`[data-hint="${k}"]`).onclick = () => { const fb = $('#fb' + k); fb.className = 'fb toon hint'; fb.innerHTML = st.hint; };
    const tk = $(`[data-toon="${k}"]`); if (tk) tk.onclick = () => {
      s.getoond = true; const fb = $('#fb' + k); fb.className = 'fb toon hint'; fb.innerHTML = 'Antwoord: ' + st.antwoord();
      setTimeout(() => stapGoed(w, p, k), 1400);
    };
    if ((s.pogingen[k] || 0) >= 2 && tk) tk.style.display = '';
  });
}
function waardeVan(st, k){
  if (st.type === 'tekst') return $('#in' + k).value;
  if (st.type === 'chips') return $$(`#ch${k} .chip.aan`).map(c => +c.dataset.j);
  if (st.type === 'keuze') return $$(`#op${k} .optie.aan`).map(c => +c.dataset.j);
  if (st.type === 'selects') return st.selects.map((x, j) => $(`#se${k}_${j}`).value);
  if (st.type === 'teken') return st._tv;
  if (st.type === 'getal') return $('#in' + k).value;
  if (st.type === 'zelf') return { tekst: $('#in' + k).value, tv: $('#in' + k), cv: $('#cv' + k), knop: $(`[data-ctl="${k}"]`) };
}
function controleer(w, p, k){
  const o = p.serie[p.idx], s = p.st[p.idx], st = o.stappen[k];
  const r = st.check(waardeVan(st, k));
  const fb = $('#fb' + k);
  if (r.ok){ fb.className = 'fb toon goed'; fb.innerHTML = r.msg || 'Goed!'; setTimeout(() => stapGoed(w, p, k), 650); }
  else if (r.neutraal){ fb.className = 'fb toon hint'; fb.innerHTML = r.msg; }
  else {
    s.pogingen[k] = (s.pogingen[k] || 0) + 1;
    fb.className = 'fb toon fout'; fb.innerHTML = r.msg;
    if (s.pogingen[k] >= 2 && $(`[data-toon="${k}"]`)) $(`[data-toon="${k}"]`).style.display = '';
  }
}
function stapGoed(w, p, k){
  const o = p.serie[p.idx], s = p.st[p.idx];
  if (s.stap !== k) return;
  s.stap = k + 1;
  if (s.stap >= o.stappen.length) s.klaar = true;
  SIM.stapGoed && SIM.stapGoed(o, k);
  if (s.klaar){
    const nietSter = p.serie.map((x, j) => [x, p.st[j]]).filter(([x]) => !x.ster);
    if (nietSter.every(([, y]) => y.klaar && !y.getoond)){
      STAAT.voortgang[w.id] = { klaar:true }; bewaar(STAAT.voortgang); renderNav();
    }
  }
  renderTekst();
}
function zetOpdrachtInSim(){
  const w = WPS[STAAT.wp], p = PER_WP[w.id];
  SIM.opdracht && SIM.opdracht(STAAT.tab === 'opd' ? p.serie[p.idx] : null, STAAT.tab === 'opd' ? p.st[p.idx] : null);
}

/* lus */
let tVorig = 0;
function lus(t){
  const dt = Math.min(0.05, (t - tVorig) / 1000 || 0); tVorig = t;
  if (SIM){ SIM.update && SIM.update(dt); SIM.draw && SIM.draw(); }
  requestAnimationFrame(lus);
}


function keuzeStap(vr, opties, o = {}){
  const opts = o.vast ? opties : schud(opties);
  return { type:'keuze', meer: !!o.meer, vr, opties: opts, hint: o.hint || '',
    check: v => {
      if (!v.length) return { ok:false, msg:'Kies een antwoord.' };
      const sel = v.map(j => opts[j]), goed = opts.filter(x => x.g);
      if (sel.length === goed.length && sel.every(x => x.g)) return { ok:true, msg: o.goedMsg };
      const fb = sel.find(x => !x.g && x.fb); if (fb) return { ok:false, msg: fb.fb };
      if (o.meer && sel.every(x => x.g)) return { ok:false, msg:'Je mist er nog een.' };
      return { ok:false, msg: o.fout || 'Nog niet goed.' };
    },
    antwoord: () => opts.filter(x => x.g).map(x => x.html).join('<br>'), goed: () => opts.map((x, j) => x.g ? j : -1).filter(j => j >= 0) };
}
function leesGetal(s){
  let t = String(s).trim().replace(/\s+/g, '').replace(/[×x*·]10\^?/i, 'e').replace(/10\^/, 'e');
  t = t.replace(',', '.').replace(/e\+/i, 'e');
  return /^-?\d*\.?\d+(e-?\d+)?$/i.test(t) ? parseFloat(t) : NaN;
}
function getalStap(vr, waarde, eenheid, uitleg, hint, tol){
  return { type:'getal', vr, eenheid, hint, ph:'getal',
    check: v => { const x = leesGetal(v); if (isNaN(x)) return { ok:false, msg:'Typ een getal, bijvoorbeeld <code>2,4</code>.' };
      if (Math.abs(x - waarde) <= Math.abs(waarde) * tol) return { ok:true, msg:'Goed! ' + uitleg };
      return { ok:false, msg:'Nog niet goed. ' + hint }; },
    antwoord: () => uitleg, goed: () => String(+waarde.toPrecision(3)).replace('.', ',') };
}

function parkeer(){ const h = $('#simhouder'); if (h) $('#parkeer').appendChild(h); }
function simStap(vr, test, hint, antwoord){ return { type:'sim', vr, hint, check: () => test() ? { ok:true } : { ok:false, msg: hint }, antwoord: () => antwoord }; }
const leerdoelen = (...l) => `<div class="leerdoelen"><b>Leerdoelen</b><ul>${l.map(x => x.startsWith('★') ? `<li class="ster">${x.slice(1).trim()}</li>` : `<li>${x}</li>`).join('')}</ul></div>`;

const NAVFILTER = 'nk-4h-filter'; const LABKEUS = []; const LABGROEP = {};
/* nav met keuze van subdomein (overschrijft renderNav) */
function renderNav(){
  const gs = [...new Set(WPS.map(w => w.groep))];
  let f = ''; try { f = localStorage.getItem(NAVFILTER) || ''; } catch (e){}
  if (f && !gs.includes(f)) f = '';
  let g = null, n = 0, h = `<select id="navf" class="navf"><option value="">alle hoofdstukken</option>${gs.map(x => `<option ${x === f ? 'selected' : ''}>${x}</option>`).join('')}</select>`;
  WPS.forEach((w, i) => {
    if (f && w.groep !== f && i !== STAAT.wp) return;
    if (w.groep !== g){ g = w.groep; n = 0; h += `<div class="navgroep">${g}</div>`; }
    n++;
    const klaar = STAAT.voortgang[w.id] && STAAT.voortgang[w.id].klaar;
    h += `<a data-i="${i}" class="${i === STAAT.wp ? 'on' : ''} ${klaar ? 'klaar' : ''}"><i>${klaar ? '✓' : w.ster ? '★' : (w.icoon || n)}</i><span>${w.titel}<small>${w.par}</small></span></a>`;
  });
  $('#nav').innerHTML = h;
  $$('#nav a').forEach(a => a.onclick = () => open(+a.dataset.i));

function getalAbs(vr, fn, eenheid, uitleg, hint, tol = 0.05){
  return { type:'getal', vr, eenheid, hint, ph:'getal',
    check: v => { const x = Math.abs(leesGetal(v)), w = Math.abs(fn()); if (isNaN(x)) return { ok:false, msg:'Typ een getal.' };
      return Math.abs(x - w) <= w * tol ? { ok:true, msg:'Goed! ' + uitleg(w) } : { ok:false, msg:'Nog niet goed. ' + hint }; },
    antwoord: () => uitleg(Math.abs(fn())), goed: () => String(Math.abs(fn())) };
}

    <p>Krachten langs één lijn tel je op (zelfde richting) of trek je af (tegengesteld). Staan twee krachten onder een hoek, dan <b>construeer</b> je F<sub>res</sub> met een parallellogram: de diagonaal vanuit het aangrijpingspunt is F<sub>res</sub>.</p>
    <div class="kader">Loodrechte krachten: F<sub>res</sub> = √(F<sub>1</sub><sup>2</sup> + F<sub>2</sub><sup>2</sup>).<br><b>Ontbinden</b> is het omgekeerde: je splitst een kracht in twee componenten. Op een helling met hellingshoek α:<br>F<sub>z,langs</sub> = F<sub>z</sub>·sin α &nbsp;&nbsp; F<sub>z,loodrecht</sub> = F<sub>z</sub>·cos α</div>`,
  voorbeeld:{ vraag:'Twee honden trekken loodrecht op elkaar aan een slee: de ene met 120 N, de andere met 160 N. Bereken F<sub>res</sub>.', stappen:['F<sub>res</sub> = √(120<sup>2</sup> + 160<sup>2</sup>) = √40 000 = 200 N.'] },
  maakSerie: () => [
    { titel:'Construeren', constr:{ type:'vector', F1:[400, 0], F2:[0, 300] }, vraag:'Op de uitwerkbijlage werken F<sub>1</sub> = 400 N en F<sub>2</sub> = 300 N loodrecht op elkaar. Schaal: 1 cm ≙ 100 N.', stappen:[
      simStap('Construeer F<sub>res</sub> vanuit het aangrijpingspunt.', () => CONSTR.ok(), 'Maak een parallellogram (hier een rechthoek).', 'F<sub>res</sub> geconstrueerd'),
      getalStap('Bereken F<sub>res</sub> met Pythagoras:', 500, 'N', 'F<sub>res</sub> = √(400<sup>2</sup> + 300<sup>2</sup>) = 500 N.', 'F<sub>res</sub> = √(F<sub>1</sub><sup>2</sup> + F<sub>2</sub><sup>2</sup>).', 0.01)] },
    { titel:'Langs één lijn', vraag:'Een sleepboot trekt een schip met 400 N naar voren. De wrijving met het water is 250 N.', stappen:[
      getalStap('Bereken de resulterende kracht:', 150, 'N', 'F<sub>res</sub> = 400 − 250 = 150 N, naar voren.', 'Tegengestelde krachten trek je af.', 0.01)] },
    { titel:'Helling', constr:{ type:'helling', hoek:25, Fz:500 }, vraag:'Op de uitwerkbijlage staat een kist op een helling van 25°. De zwaartekracht (500 N) is getekend: 1 cm ≙ 100 N.', stappen:[
      simStap('Teken de component van F<sub>z</sub> langs de helling, vanuit het aangrijpingspunt.', () => CONSTR.ok(), 'Trek vanaf de punt van F<sub>z</sub> een lijn loodrecht op de helling.', 'component langs de helling getekend'),
      getalStap('Bereken de component van F<sub>z</sub> langs de helling:', 211.3, 'N', 'F<sub>z,langs</sub> = 500 · sin 25° = 2,1·10<sup>2</sup> N.', 'F<sub>z</sub>·sin α.', 0.02)] },
    { titel:'Twee gelijke krachten', vraag:'Twee krachten van elk 300 N werken loodrecht op elkaar.', stappen:[
      getalStap('Bereken de resulterende kracht:', 424.3, 'N', 'F<sub>res</sub> = √(300<sup>2</sup> + 300<sup>2</sup>) = 4,2·10<sup>2</sup> N.', 'Pythagoras.', 0.01)] },
    { titel:'Schuin trekken', ster:true, vraag:'Een kind trekt een slee met een touw dat een hoek van 30° met de grond maakt. De spankracht in het touw is 200 N.', stappen:[
      getalStap('Bereken de horizontale component van de spankracht:', 173.2, 'N', 'F<sub>hor</sub> = 200 · cos 30° = 1,7·10<sup>2</sup> N.', 'De horizontale component ligt aan de hoek: gebruik cos.', 0.01),
      keuzeStap('Wat doet de verticale component van de spankracht?', [{ html:'die tilt de slee een beetje op, zodat de normaalkracht kleiner wordt', g:1 }, { html:'die trekt de slee harder vooruit' }, { html:'die maakt de zwaartekracht groter' }, { html:'die heeft geen enkel effect' }])] }
  ] });

/* ---------- 3.3 eerste wet van Newton ---------- */
dwp(H3, { id:'q3_n1', titel:'De eerste wet van Newton', par:'3⁠.3 · F<sub>res</sub> = 0', sim:VAL, voorSim: () => { VAL.m = 75; VAL.cwA = 0.6; VAL.spoor = null; },
  uitleg: () => leerdoelen('Ik pas de eerste wet van Newton toe: F<sub>res</sub> = 0 ↔ stilstand of constante snelheid.', 'Ik bepaal een onbekende kracht als de snelheid constant is.', 'Ik leg traagheid uit.', '★ Ik bereken de spankracht in een liftkabel bij constante snelheid.') + `
    <p><b>Eerste wet van Newton</b>: als de resulterende kracht op een voorwerp nul is, blijft het stilstaan of beweegt het met constante snelheid in een rechte lijn. Omgekeerd: beweegt iets met constante snelheid, dan is F<sub>res</sub> = 0.</p>
    <p>Een voorwerp ‘wil’ zijn beweging houden: dat heet <b>traagheid</b>. Daarom schiet je naar voren als een bus hard remt.</p>
    <div class="kader">Rechts valt een parachutist. De luchtweerstand neemt toe met de snelheid. Als F<sub>w,lucht</sub> = F<sub>z</sub>, is F<sub>res</sub> = 0 en valt hij met een constante <b>eindsnelheid</b>.</div>`,
  voorbeeld:{ vraag:'Een vrachtwagen rijdt met constante snelheid. De motor levert een voorwaartse kracht van 4,5 kN. Hoe groot is de totale wrijvingskracht?', stappen:['Constante snelheid, dus F<sub>res</sub> = 0.', 'F<sub>w</sub> = F<sub>motor</sub> = 4,5 kN.'] },
  maakSerie: () => [
    { titel:'F<sub>res</sub> = 0?', vraag:'Hieronder staan zes situaties.', stappen:[
      chipStap('In welke situaties is F<sub>res</sub> = 0? Kies alle juiste.', [{ html:'een auto rijdt met constant 100 ' + KMH + ' rechtdoor', g:1 }, { html:'een boek ligt stil op tafel', g:1 }, { html:'een parachutist valt met zijn eindsnelheid', g:1 }, { html:'een bal valt net na het loslaten' }, { html:'een fietser remt af' }, { html:'een auto rijdt met constante snelheid door een bocht' }], 'F<sub>res</sub> = 0 betekent: geen verandering van snelheid én richting.')] },
    { titel:'Eindsnelheid', vraag:'Een parachutist van 75 kg (met uitrusting) valt met zijn eindsnelheid.', stappen:[
      getalStap('Bereken de luchtweerstand op de parachutist:', 735.75, 'N', 'F<sub>w,lucht</sub> = F<sub>z</sub> = 75 · 9,81 = 7,4·10<sup>2</sup> N.', 'Bij de eindsnelheid is F<sub>res</sub> = 0.', 0.01)] },
    { titel:'Auto', vraag:'Een auto rijdt met constant 100 ' + KMH + '. De motor levert een voorwaartse kracht van 600 N.', stappen:[
      getalStap('Hoe groot is de totale wrijvingskracht?', 600, 'N', 'Constante snelheid: F<sub>w</sub> = 600 N.', 'Eerste wet van Newton.', 0.01)] },
    { titel:'Traagheid', vraag:'Je staat in een bus zonder je vast te houden. De bus remt plotseling.', stappen:[
      zelfStap('Leg met traagheid uit wat er met je gebeurt.', ['inzicht dat je lichaam zijn snelheid wil houden (traagheid)', 'inzicht dat er geen (of te weinig) kracht op je werkt die je afremt', 'conclusie: je beweegt ten opzichte van de bus naar voren'], 'Je lichaam wil met dezelfde snelheid doorgaan (traagheid). De bus remt, maar op jou werkt geen kracht die je even hard afremt. Daardoor beweeg je ten opzichte van de bus naar voren.')] },
    { titel:'Lift', ster:true, vraag:'Een lift van 800 kg (met personen) gaat met constante snelheid omhoog.', stappen:[
      getalStap('Bereken de spankracht in de kabel:', 7848, 'N', 'Constante snelheid: F<sub>s</sub> = F<sub>z</sub> = 800 · 9,81 = 7,8·10<sup>3</sup> N.', 'Welke krachten werken er, en hoe groot is F<sub>res</sub>?', 0.01),
      keuzeStap('Hoe groot is de spankracht als de lift met dezelfde constante snelheid omlaag gaat?', [{ html:'even groot', g:1 }, { html:'kleiner', fb:'Ook nu is de snelheid constant: F<sub>res</sub> = 0.' }, { html:'groter' }, { html:'nul' }])] }
  ] });

/* ---------- 3.4 tweede wet van Newton ---------- */
dwp(H3, { id:'q3_n2', titel:'De tweede wet van Newton', par:'3⁠.4 · F<sub>res</sub> = m·a', sim:SPIEK, voorSim: () => SPIEK.zet(['bereken']),
  uitleg: () => leerdoelen('Ik reken met F<sub>res</sub> = m·a.', 'Ik bepaal eerst F<sub>res</sub> uit meerdere krachten en bereken dan a.', 'Ik bereken F<sub>res</sub> uit een snelheidsverandering.', '★ Ik bereken de spankracht in een liftkabel bij versnellen.') + `
    <p><b>Tweede wet van Newton</b>: F<sub>res</sub> = m·a. Hoe groter de resulterende kracht en hoe kleiner de massa, hoe groter de versnelling.</p>
    <div class="kader">Stappenplan:<br>1. Bepaal F<sub>res</sub> (krachten in de bewegingsrichting positief).<br>2. Gebruik F<sub>res</sub> = m·a.<br>3. Is de versnelling onbekend? Bereken a = ${BR('Δv', 'Δt')}.</div>`,
  voorbeeld:{ vraag:'Een skiër van 70 kg glijdt een helling af. De resulterende kracht is 140 N. Bereken de versnelling.', stappen:['a = ' + BR('F<sub>res</sub>', 'm') + ' = ' + BR('140 N', '70 kg') + ' = 2,0 ' + MS2 + '.'] },
  maakSerie: () => [
    { titel:'Scooter', vraag:'Op een scooter met bestuurder (150 kg) werkt een resulterende kracht van 450 N.', stappen:[
      getalStap('Bereken de versnelling:', 3.0, MS2, 'a = ' + BR('450', '150') + ' = 3,0 ' + MS2 + '.', 'a = ' + BR('F<sub>res</sub>', 'm') + '.', 0.01)] },
    { titel:'Optrekken', vraag:'Een auto van 1200 kg trekt in 10 s op van 0 tot 100 ' + KMH + '.', stappen:[
      getalStap('Bereken de versnelling:', 2.778, MS2, 'v = 27,8 ' + MS + '; a = ' + BR('27,8', '10') + ' = 2,8 ' + MS2 + '.', 'Reken eerst om naar ' + MS + '.', 0.02),
      getalStap('Bereken de resulterende kracht:', 3333, 'N', 'F<sub>res</sub> = 1200 · 2,78 = 3,3·10<sup>3</sup> N.', 'F<sub>res</sub> = m·a.', 0.02)] },
    { titel:'Met wrijving', vraag:'De motor van een auto van 1200 kg levert 2400 N. De totale wrijving is 600 N.', stappen:[
      getalStap('Bereken de resulterende kracht:', 1800, 'N', '2400 − 600 = 1800 N.', 'Stap 1 van het stappenplan.', 0.01),
      getalStap('Bereken de versnelling:', 1.5, MS2, 'a = ' + BR('1800', '1200') + ' = 1,5 ' + MS2 + '.', 'Stap 2.', 0.01)] },
    { titel:'Remmen', vraag:'Een fietser van 80 kg (met fiets) remt in 2,0 s van 8,0 ' + MS + ' tot stilstand.', stappen:[
      getalStap('Bereken de grootte van de resulterende kracht:', 320, 'N', 'a = ' + BR('0 − 8,0', '2,0') + ' = −4,0 ' + MS2 + '; F<sub>res</sub> = 80 · 4,0 = 3,2·10<sup>2</sup> N, tegen de beweging in.', 'Bereken eerst a.', 0.01)] },
    { titel:'Versnellende lift', ster:true, vraag:'Een lift van 600 kg versnelt omhoog met 1,2 ' + MS2 + '.', stappen:[
      getalStap('Bereken de resulterende kracht op de lift:', 720, 'N', 'F<sub>res</sub> = 600 · 1,2 = 720 N, omhoog.', 'F<sub>res</sub> = m·a.', 0.01),
      getalStap('Bereken de spankracht in de kabel:', 6606, 'N', 'F<sub>s</sub> − F<sub>z</sub> = F<sub>res</sub>, dus F<sub>s</sub> = 600 · 9,81 + 720 = 6,6·10<sup>3</sup> N.', 'F<sub>res</sub> is het verschil tussen de spankracht en de zwaartekracht.', 0.01)] }
  ] });

/* ---------- 4.1 A, T en f ---------- */
const OSCH1 = { tmax:24, umax:5, dx:2, dy:1, sporen:[{ A:4, T:6, fase:0 }] };
dwp(H4, { id:'q4_eig', titel:'Eigenschappen van trillingen', par:'4⁠.1 · A, T en f', sim:OSC,
  uitleg: () => leerdoelen('Ik bepaal de amplitude en de trillingstijd uit een (u,t)-diagram.', 'Ik reken met f = ' + BR('1', 'T') + '.', 'Ik reken trillingstijden om tussen s en ms.', '★ Ik bepaal T en f uit een meting van meerdere trillingen.') + `
    <p>Een <b>trilling</b> is een heen-en-weergaande beweging rond een evenwichtsstand. De <b>uitwijking</b> u is de afstand tot de evenwichtsstand. De grootste uitwijking is de <b>amplitude</b> A.</p>
    <div class="kader"><b>Trillingstijd</b> T: de tijd voor één volledige trilling (s).<br><b>Frequentie</b> f: het aantal trillingen per seconde (Hz).<br>f = ${BR('1', 'T')} &nbsp;&nbsp; T = ${BR('1', 'f')}</div>

      getalStap('Bereken de trillingstijd:', 0.8333, 's', 'T = ' + BR('60 s', '72') + ' = 0,83 s.', 'Hoeveel seconden duurt één slag?', 0.02),
      getalStap('Bereken de frequentie:', 1.2, 'Hz', 'f = ' + BR('72', '60 s') + ' = 1,2 Hz.', 'Aantal per seconde.', 0.02)] },
    { titel:'Stemvork', vraag:'Een stemvork trilt met 440 Hz.', stappen:[

    { titel:'Meting', ster:true, vraag:'Een leerling meet dat een schommel 25 trillingen maakt in 80 s.', stappen:[

    { titel:'Harmonisch?', vraag:'Niet elke trilling is harmonisch.', stappen:[

/* =====================================================================
   Docentmodus: uitwerkingen bij elke opdracht en een antwoordenblad
   Aanzetten met #docent achter de link.
   ===================================================================== */
const DOCKEY = 'nk-docentmodus';
if (/docent/.test(location.hash)) try { localStorage.setItem(DOCKEY, '1'); } catch (e){}
let DOCENT = false; try { DOCENT = localStorage.getItem(DOCKEY) === '1'; } catch (e){}
function docStap(st){
  try {
    if (st.type === 'zelf') return spLijst(st.punten.map(p => [1, p])) + (st.model ? `<div class="model">${st.model}</div>` : '');
    if (st.type === 'sim') return '<i>Leerling stelt in:</i> ' + (st.hint || '');
    if (st.type === 'chips') return st.opties.filter(x => x.g).map(x => x.html).join(' · ');
    const a = st.antwoord ? st.antwoord() : '';
    return a && !/undefined|null|NaN/.test(a) ? a : (st.hint || '—');
  } catch (e){ return '<i>Hangt af van de meting van de leerling.</i> ' + (st.hint || ''); }
}
function docOpdracht(o, kop){
  return `<div class="dopd">${kop ? `<div class="dtitel">${kop}</div>` : ''}${o.stappen.map((st, k) => `<div class="dstap"><span class="n">${k + 1}</span><div><div class="dvr">${st.vr || ''}</div><div class="dant">${docStap(st)}</div></div></div>`).join('')}</div>`;
}
const _renderOpdracht = renderOpdracht;
renderOpdracht = function(w, p){
  let h = _renderOpdracht(w, p);
  if (DOCENT){ const o = p.serie[p.idx]; h += `<div class="docent"><div class="dkop">Docent · uitwerking van deze opdracht</div>${docOpdracht(o)}</div>`; }
  return h;
};
function antwoordenblad(){
  let filter = ''; try { if (typeof NAVFILTER !== 'undefined') filter = localStorage.getItem(NAVFILTER) || ''; } catch (e){}
  const titel = document.title;
  let h = `<div class="geenprint ablknop"><button class="btn" id="abl_print">Opslaan als pdf / printen</button><button class="btn g" id="abl_dicht">Sluiten</button>
    <span class="noot">Opdrachten met willekeurige getallen staan hier met de getallen van de huidige serie.</span></div>
    <h1>${titel} · antwoordenblad</h1><div class="ameta">${filter ? filter + ' · ' : ''}${new Date().toLocaleDateString('nl-NL', { day:'numeric', month:'long', year:'numeric' })}</div>`;
  let groep = null;
  WPS.forEach(w => {
    if (filter && w.groep !== filter) return;
    if (w.eigen){
      if (typeof DIAG !== 'undefined'){ h += `<h2>Diagnose</h2>` + DIAG.map(sd => `<h3>${sd.sub} ${sd.naam}</h3>` + sd.items.map(it => `<div class="aopd"><div class="atitel">${it.id} · ${it.ww} · ${it.p}p</div>${it.fig || ''}<div class="avraag">${it.vraag}</div>
        ${it.type === 'getal' ? `<div class="dant"><b>Antwoord:</b> ${tien(it.w, it.nsig || 3)} ${it.eenh}${it.nsig ? ` (${it.nsig} significante cijfers)` : ''}</div>` : ''}
        ${it.type === 'keuze' ? `<div class="dant"><b>Antwoord:</b> ${it.opties.filter(o => o.g).map(o => o.html).join(' · ')}</div>` : ''}${spLijst(it.uitw)}</div>`).join('')).join(''); }
      return;
    }
    if (w.groep !== groep){ groep = w.groep; h += `<h2>${groep}</h2>`; }
    if (!PER_WP[w.id]) nieuweSerie(w);
    const p = PER_WP[w.id];
    h += `<h3>${w.titel}${w.ster ? ' ★' : ''}</h3>` + p.serie.map((o, k) => `<div class="aopd"><div class="atitel">${o.ster ? '★' : 'Opdracht ' + (k + 1)} · ${o.titel}</div>${o.vraag ? `<div class="avraag">${o.vraag}</div>` : ''}${docOpdracht(o)}</div>`).join('');
  });
  let el = $('#ablad'); if (!el){ el = document.createElement('div'); el.id = 'ablad'; document.body.appendChild(el); }
  el.innerHTML = h; document.body.classList.add('ablad-open'); el.scrollTop = 0;
  $('#abl_dicht').onclick = () => document.body.classList.remove('ablad-open');
  $('#abl_print').onclick = () => window.print();
}
if (DOCENT){
  const v = document.querySelector('aside .voet');
  if (v){ const d = document.createElement('div'); d.className = 'docvoet';
    d.innerHTML = `<div class="dlabel">Docentmodus</div><button id="ablknop">Antwoordenblad</button><button id="docuit">Docentmodus uit</button>`;
    v.prepend(d);
    $('#ablknop').onclick = antwoordenblad;
    $('#docuit').onclick = () => { try { localStorage.removeItem(DOCKEY); } catch (e){} location.hash = ''; location.reload(); }; }
}

/* ---------- start ---------- */
$('#beamerknop').onclick = () => document.body.classList.toggle('beamer');
$('#resetknop').onclick = () => { if (confirm('Alle voortgang wissen?')){ STAAT.voortgang = {}; bewaar({}); for (const k in PER_WP) delete PER_WP[k]; open(STAAT.wp); } };
open(0);
requestAnimationFrame(lus);
